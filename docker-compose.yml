version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: enterprise_ai_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Admin123!
      POSTGRES_DB: EnterpriseAIDb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
